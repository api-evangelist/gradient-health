aid: gradient-health
name: Gradient Health
description: >-
  Gradient Health is a multimodal medical data company that accelerates medical
  AI development by giving AI developers secure, self-service access to diverse,
  de-identified medical imaging data. Its Atlas platform lets teams search a
  catalog of 20M+ de-identified imaging studies across hundreds of DICOM tags
  with longitudinal, patient-level search, construct representative cohorts, and
  export full DICOM datasets. Gradient Health sources, de-identifies, curates,
  and delivers data from a network of healthcare data partners, and is HIPAA
  compliant and AICPA SOC 2 certified. First-party open-source tooling supports
  cloud-optimized DICOM storage, parsing, and TensorFlow decode operations.
